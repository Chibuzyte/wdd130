<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description"
      content="Lorem ipsum dolor sit amet consectetur, adipisicing elit. Aut, voluptates.">
    <meta name="author" content="Chibuzo Idia">
    <link rel="stylesheet" href="styles/rafting.css">
</head>


<body>
    <header>


        <nav class="navbar">
            <div class="logo">
                <img src="images/splash.jpg" alt="logo">
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="information">
        <h1>White Water Rafting Company</h1>
        <h6>123 Main River Street</h6>
        <h6>Kolob, California</h6>
        <h6>+1 999 999 9999</h6>
        <h6>info@whitewater.com</h6>


        <section class="container">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d63405.22462739843!2d3.1808535577636787!3d6.668405265040082!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1775931003831!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form class="form-side">
                <div class="form-item">
                    <label for="full-name">Name</label>
                    <input type="text" id="full-name" name="visitor's name"
                      placeholder="Placeholder">
                </div>


                <div class="form-item">
                    <label for="user-email" id="user-email">Email</label>
                    <input type="email" placeholder="Placeholder">
                </div>


                <div class="form-item">
                    <label>Message Purpose</label>
                    <div class="radio-group">
                        <label for="purpose-gen"><input type="radio" id="purpose-gen" name="purpose"
                              value="general">General Inquiry</label>
                        <label for="purpose-res"><input type="radio" id="purpose-res" name="purpose"
                              value="reservation">Reservation Question</label>
                        <label for="purpose-web"><input type="radio" id="purpose-res" name="purpose"
                              value="website">Website Suggestion</label>

                    </div>
                </div>

                <div class="form-item two">
                    <label for="message-box">Message</label>
                    <textarea id="message-box" name="message-content"
                      placeholder="Type here"></textarea>
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="subscribe" name="subscribe_newsletter">
                    <label for="subscribe">Please Subscribe me to the monthly newsletter</label>

                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>
    </main>


    <section class="employee">
        <h3>We Are Here to Serve You</h3>


        <div class="profile-container">
            <div class="profile-card">
                <img src="./images/profile.png" alt="employee photocard">
                <p>Employee Profile</p>
            </div>

            <div class="profile-card">
                <img src="./images/profile.png" alt="employee photocard">
                <p>Employee Profile</p>
            </div>

            <div class="profile-card">
                <img src="./images/profile.png" alt="employee photocard">
                <p>Employee Profile</p>
            </div>


        </div>
    </section>
    <footer class="footer">
        <p>&copy; 2026 Chibuzyte Rafting Company Chibuzo Idia</p>

        <nav class="socialmedia">
            <div class="icon"><a href="https://facebook.com"><img src="./images/facebook.svg"
                      alt="FacebookIcon"></a></div>
            <div class="icon"><a href="https://linkedin.com"><img src="./images/linkedin.svg"
                      alt="LinkedIn Icon"></a></div>
            <div class="icon"><a href="https://instagram.com"><img src="./images/instagram.svg"
                      alt="Instagram Icon"></a></div>


        </nav>
    </footer>

</body>


</html>
